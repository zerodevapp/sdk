name: Pull request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  size:
    if: false
    name: Size
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Report bundle size
        uses: andresz1/size-limit-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: bun
  e2e-local:
    name: E2E (local)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      ARB_SEPOLIA_RPC_URL: ${{ secrets.ARB_SEPOLIA_RPC_URL }}

    steps:
      - name: Check fork RPC secrets
        id: secrets
        run: |
          if [ -z "$SEPOLIA_RPC_URL" ] || [ -z "$ARB_SEPOLIA_RPC_URL" ]; then
            echo "::notice::Fork RPC secrets unavailable (PR from an external fork); skipping local e2e."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone repository
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Install dependencies
        if: steps.secrets.outputs.ok == 'true'
        uses: ./.github/actions/install-dependencies

      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: bun run build

      - name: Gateway unit tests
        if: steps.secrets.outputs.ok == 'true'
        working-directory: packages/e2e
        run: bun run test:gateway

      - name: Restore anvil fork cache
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: packages/e2e/.cache/anvil
          key: anvil-${{ hashFiles('packages/e2e/docker/stack.env') }}

      - name: Set up Docker Buildx
        if: steps.secrets.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Start local stack
        if: steps.secrets.outputs.ok == 'true'
        working-directory: packages/e2e
        run: bun run local:up

      - name: Run e2e suite
        if: steps.secrets.outputs.ok == 'true'
        working-directory: packages/e2e
        run: bun run test

      # Only Ultra Relay and gateway logs: anvil prints its fork URL, which
      # contains the RPC key, and artifacts of this public repo are public.
      - name: Dump stack logs
        if: failure() && steps.secrets.outputs.ok == 'true'
        working-directory: packages/e2e
        run: bun docker/stack.ts logs ur-sepolia ur-arbsepolia gateway > stack.log 2>&1

      - name: Upload stack logs
        if: failure() && steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: packages/e2e/stack.log

      # anvil writes its fork cache only on shutdown; stop the stack before
      # actions/cache saves .cache/anvil in its post step.
      - name: Stop local stack
        if: always() && steps.secrets.outputs.ok == 'true'
        working-directory: packages/e2e
        run: bun run local:down
