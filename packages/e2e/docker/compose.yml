name: zerodev-e2e

x-anvil: &anvil
  image: ghcr.io/foundry-rs/foundry:v1.1.0
  user: root
  healthcheck:
    test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
    interval: 2s
    timeout: 5s
    retries: 90

x-ur: &ur
  image: zerodev-e2e/ultra-relay:${ULTRA_RELAY_SHA}
  build:
    context: https://github.com/zerodevapp/ultra-relay.git#${ULTRA_RELAY_SHA}
  command: ["--config", "/app/ur.json"]
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4337/health"]
    interval: 2s
    timeout: 5s
    retries: 90

services:
  anvil-sepolia:
    <<: *anvil
    entrypoint:
      - anvil
      - --host=0.0.0.0
      - --port=8545
      - --fork-url=${SEPOLIA_RPC_URL:?SEPOLIA_RPC_URL is required}
      - --fork-block-number=${SEPOLIA_FORK_BLOCK}
      - --retries=20
      - --fork-retry-backoff=1000
      - --compute-units-per-second=100
    ports: ["8545:8545"]
    volumes: ["../.cache/anvil:/root/.foundry/cache"]

  anvil-arbsepolia:
    <<: *anvil
    entrypoint:
      - anvil
      - --host=0.0.0.0
      - --port=8545
      - --fork-url=${ARB_SEPOLIA_RPC_URL:?ARB_SEPOLIA_RPC_URL is required}
      - --fork-block-number=${ARB_SEPOLIA_FORK_BLOCK}
      - --retries=20
      - --fork-retry-backoff=1000
      - --compute-units-per-second=100
    ports: ["8546:8545"]
    volumes: ["../.cache/anvil:/root/.foundry/cache"]

  ur-sepolia:
    <<: *ur
    volumes: ["./ur.sepolia.json:/app/ur.json:ro"]
    ports: ["4337:4337"]
    depends_on:
      anvil-sepolia: { condition: service_healthy }

  ur-arbsepolia:
    <<: *ur
    volumes: ["./ur.arbsepolia.json:/app/ur.json:ro"]
    ports: ["4338:4337"]
    depends_on:
      anvil-arbsepolia: { condition: service_healthy }

  gateway:
    image: oven/bun:1.3.13-alpine
    command: ["bun", "run", "/app/gateway.ts"]
    environment:
      PORT: "4000"
      GATEWAY_UPSTREAMS: '{"11155111":"http://ur-sepolia:4337/rpc","421614":"http://ur-arbsepolia:4337/rpc"}'
    volumes: ["./gateway.ts:/app/gateway.ts:ro"]
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      ur-sepolia: { condition: service_healthy }
      ur-arbsepolia: { condition: service_healthy }
